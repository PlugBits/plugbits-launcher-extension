name = "plugbits-api"
main = "src/index.js"
compatibility_date = "2024-01-01"
account_id = "c1b523f7c9512c4e19a953d80a216f57"

# トライアルのリマインダーメール送信（毎日 00:00 UTC = 09:00 JST）
[triggers]
crons = ["0 0 * * *"]

[[kv_namespaces]]
binding = "LICENSES"
id = "306e0240845b49709b3333a7fb3d85ee"
preview_id = "YOUR_KV_PREVIEW_ID"    # preview 用

[vars]
# ALLOWED_ORIGIN = "chrome-extension://femlefbhnobmpdaabkmkaklobbcgacpa"
ALLOWED_ORIGIN = "*"

# Secrets（wrangler secret put で登録）:
#   STRIPE_SECRET_KEY       = sk_live_...
#   STRIPE_WEBHOOK_SECRET   = whsec_...
#   BREVO_API_KEY           = xkeysib-...
#   BREVO_SENDER_EMAIL      = no-reply@plugbits.app
#   BREVO_SENDER_NAME       = PlugBits Launcher

# ドメイン単位ライセンス機能(/domain-status)の動作確認用ステージング環境。
# 本番とは別のKV namespace・cronは無し(トライアルリマインダーの誤爆防止)。
# id は仮置き(オケオ作成待ち)。Stripe/Brevoのsecretsは本番と分けて別途登録する。
[env.staging]
name = "plugbits-api-staging"

[env.staging.triggers]
crons = []

[[env.staging.kv_namespaces]]
binding = "LICENSES"
id = "78e41230f0434447b04a8b949e2fc41f"

[env.staging.vars]
ALLOWED_ORIGIN = "*"
